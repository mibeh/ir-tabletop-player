[project]
name = "ir-tabletop-player"
version = "0.1.0"
description = "IR Tabletop Player"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "greenlet>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "python-docx==1.2.0",
    "python-multipart>=0.0.31",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.5.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "ui: browser tests requiring playwright + live server (slower)",
]
